<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dela Pena</title>

<style>

/* GENERAL */

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;

  width: 100%;
  min-height: 100%;

  background: #ffffff;

  font-family: Arial, Helvetica, sans-serif;
}

body {
  display: flex;
  justify-content: center;
}


/* MAIN PAGE */

.page {
  width: 100%;
  max-width: 500px;

  min-height: 100vh;
  min-height: 100dvh;

  background: #ffffff;
  color: #000000;

  display: flex;
  flex-direction: column;
  align-items: center;

  text-align: center;
}


/* TOP CONTENT */

.content {
  width: 100%;

  padding-top: clamp(45px, 8vh, 90px);

  display: flex;
  flex-direction: column;
  align-items: center;
}


/* TAGLINE */

.tagline {
  font-size: 11px;
  font-weight: 300;

  letter-spacing: 4px;

  white-space: nowrap;

  text-align: center;
}


/* SOCIAL ICON GRID */

.links {
  display: grid;

  grid-template-columns: 44px 44px;

  column-gap: 85px;
  row-gap: 38px;

  justify-content: center;
  align-items: center;

  margin-top: clamp(45px, 8vh, 80px);
  margin-bottom: 35px;
}


/* CLICKABLE ICON AREA */

.links a {
  width: 44px;
  height: 44px;

  display: flex;
  align-items: center;
  justify-content: center;

  text-decoration: none;

  transition: transform 0.2s ease;
}

.links a:hover {
  transform: scale(1.10);
}


/* ICON SIZE */

.links img {
  width: 32px;
  height: 32px;

  object-fit: contain;

  filter: brightness(0);
}


/* PHOTO SECTION */

.photo {
  width: 100%;

  margin-top: auto;

  display: flex;
  justify-content: center;
  align-items: flex-end;

  overflow: hidden;
}


/* RESPONSIVE PHOTO */

.photo img {
  display: block;

  width: 100%;
  height: auto;

  object-fit: contain;
  object-position: center bottom;
}


/* TABLETS AND SMALL PHONES */

@media (max-width: 500px) {

  .content {
    padding-top: clamp(45px, 7vh, 75px);
  }

  .tagline {
    font-size: clamp(8px, 2.5vw, 11px);
    letter-spacing: clamp(2px, 0.9vw, 4px);
  }

  .links {
    grid-template-columns: 44px 44px;

    column-gap: 75px;
    row-gap: 36px;

    margin-top: clamp(45px, 8vh, 75px);
    margin-bottom: 35px;
  }

  .links img {
    width: 31px;
    height: 31px;
  }

}


/* SHORT SCREENS */

@media (max-height: 650px) {

  .content {
    padding-top: 35px;
  }

  .links {
    margin-top: 35px;
    margin-bottom: 20px;
    row-gap: 20px;
  }

}


/* DESKTOP */

@media (min-width: 768px) {

  .page {
    max-width: 500px;
  }

  .content {
    padding-top: 80px;
  }

  .links {
    margin-top: 75px;
  }

}

</style>

</head>


<body>

<div class="page">


  <!-- TOP CONTENT -->

  <div class="content">


    <!-- TAGLINE -->

    <div class="tagline">
      LEVERAGE YOUR DIFFERENTIAL
    </div>



    <!-- SOCIAL MEDIA ICONS -->

    <div class="links">


      <!-- LINKEDIN -->

      <a
        href="https://www.linkedin.com/in/jiahdelapena/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="LinkedIn">

        <img
          src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/linkedin.svg"
          alt="LinkedIn">

      </a>



      <!-- WHATSAPP -->

      <a
        href="https://wa.me/message/6ZUUCCETCAHSI1"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="WhatsApp">

        <img
          src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/whatsapp.svg"
          alt="WhatsApp">

      </a>



      <!-- INSTAGRAM -->

      <a
        href="https://www.instagram.com/jiahdelapena"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Instagram">

        <img
          src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/instagram.svg"
          alt="Instagram">

      </a>



      <!-- EMAIL -->

      <a
        href="mailto:sjndp.work@gmail.com,jiahdelapena@gmail.com?subject=Let%27s%20connect%21&body=Hello%20Jiah%2C%0D%0A%0D%0A"
        aria-label="Email">

        <img
          src="https://cdn.jsdelivr.net/npm/lucide-static@latest/icons/mail.svg"
          alt="Email">

      </a>


    </div>

  </div>



  <!-- PORTRAIT -->

  <div class="photo">

    <img
      src="photo1.jpg"
      alt="Dela Pena">

  </div>


</div>

</body>

</html>
