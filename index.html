<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dela Pena</title>

<style>

/* GENERAL */

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;

  width: 100%;
  min-height: 100%;

  background: #ffffff;

  font-family: Arial, Helvetica, sans-serif;
}

body {
  display: flex;
  justify-content: center;
}


/* MAIN PAGE */

.page {
  width: 100%;
  max-width: 500px;

  min-height: 100vh;
  min-height: 100dvh;

  background: #ffffff;
  color: #000000;

  display: flex;
  flex-direction: column;
  align-items: center;

  overflow: hidden;
}


/* TOP CONTENT */

.content {
  width: 100%;

  padding-top: clamp(140px, 25dvh, 260px);

  display: flex;
  flex-direction: column;
  align-items: center;

  flex-shrink: 0;
}


/* MULTILINGUAL TEXT */

.languages {
  width: 100%;

  text-align: center;

  font-size: clamp(7px, 1.9vw, 9.5px);

  font-weight: 300;

  letter-spacing: clamp(1px, 0.5vw, 2px);

  line-height: 2.1;

  white-space: nowrap;
}


/* INTERNATIONAL PHRASES — LIGHT GRAY */

.line1,
.line2,
.line3 {
  color: #d6d6d6;
}


/* ENGLISH TEXT */

.english {
  color: #111111;

  letter-spacing: clamp(2px, 0.8vw, 4px);

  text-transform: uppercase;
}


/* DIFFERENTIAL — DEEP RED */

.orange {
  color: #a20200;
}


/* ICON ROW */

.links {
  width: 100%;

  display: flex;

  justify-content: center;
  align-items: center;

  gap: clamp(45px, 12vw, 65px);

  margin-top: clamp(45px, 7dvh, 70px);

  margin-bottom: clamp(35px, 5dvh, 55px);
}


/* ICON CLICK AREA */

.links a {
  width: 42px;
  height: 42px;

  display: flex;
  align-items: center;
  justify-content: center;

  text-decoration: none;

  transition: transform 0.2s ease;
}

.links a:hover {
  transform: scale(1.08);
}


/* ORIGINAL BRAND ICONS */

.links img {
  width: 31px;
  height: 31px;

  object-fit: contain;

  filter: brightness(0);
}


/* EMAIL SAME VISUAL SIZE */

.links .email img {
  width: 32px;
  height: 32px;
}


/* PHOTO */

.photo {
  width: 100%;

  margin-top: auto;

  display: flex;
  justify-content: center;
  align-items: flex-end;

  flex-shrink: 0;

  overflow: hidden;
}

.photo img {
  display: block;

  width: 100%;
  height: auto;

  margin: 0;
  padding: 0;

  object-fit: contain;
  object-position: center bottom;

  vertical-align: bottom;
}


/* SHORT SCREENS */

@media (max-height: 750px) {

  .content {
    padding-top: 75px;
  }

  .links {
    margin-top: 35px;
    margin-bottom: 20px;
  }

}


/* SMALL PHONES */

@media (max-width: 380px) {

  .languages {
    font-size: 6.5px;
    letter-spacing: 0.6px;
  }

  .english {
    letter-spacing: 1.5px;
  }

  .links {
    gap: 36px;
  }

  .links img {
    width: 28px;
    height: 28px;
  }

  .links .email img {
    width: 29px;
    height: 29px;
  }

}


/* DESKTOP */

@media (min-width: 768px) {

  .content {
    padding-top: clamp(140px, 22vh, 230px);
  }

}

</style>

</head>


<body>


<div class="page">

</html>
