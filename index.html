<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dela Pena</title>

<style>

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  background: #000;
  font-family: Arial, Helvetica, sans-serif;
}

body {
  display: flex;
  justify-content: center;
}

.page {
  width: 100%;
  max-width: 500px;
  min-height: 100vh;
  background: #000;
  color: #fff;
  text-align: center;
  padding-bottom: 60px;
}


/* PHOTO */

.photo {
  position: relative;
  width: 100%;
  height: 480px;
  overflow: hidden;
}

.photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center top;
}


/* PHOTO TO BLACK FADE */

.photo::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 45%;

  background: linear-gradient(
    to bottom,
    rgba(0,0,0,0) 0%,
    #000 100%
  );
}


/* TAGLINE */

.tagline {
  position: relative;
  z-index: 2;

  margin-top: -25px;

  font-size: 13px;
  font-weight: 300;
  letter-spacing: 7px;
  white-space: nowrap;
}


/* SOCIAL ICON AREA */

.links {
  margin-top: 50px;

  display: flex;
  flex-direction: column;
  align-items: center;

  gap: 38px;

  padding-bottom: 25px;
}


/* EACH ICON */

.links a {
  width: 40px;
  height: 40px;

  display: flex;
  align-items: center;
  justify-content: center;

  text-decoration: none;

  transition: transform 0.2s ease;
}

.links a:hover {
  transform: scale(1.12);
}


/* ALL ICONS SAME SIZE + WHITE */

.links img {
  width: 34px;
  height: 34px;

  object-fit: contain;

  filter: brightness(0) invert(1);
}


</style>
</head>


<body>

<div class="page">


  <!-- PORTRAIT -->

  <div class="photo">
    <img src="photo.jpg" alt="Dela Pena">
  </div>


  <!-- TAGLINE -->

  <div class="tagline">
    LEVERAGE DIFFERENTIAL
  </div>


  <!-- SOCIAL LINKS -->

  <div class="links">


    <!-- LINKEDIN -->

    <a href="YOUR-LINKEDIN-LINK" target="_blank" aria-label="LinkedIn">

      <img
        src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/linkedin.svg"
        alt="LinkedIn">

    </a>


    <!-- WHATSAPP -->

    <a href="YOUR-WHATSAPP-LINK" target="_blank" aria-label="WhatsApp">

      <img
        src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/whatsapp.svg"
        alt="WhatsApp">

    </a>


    <!-- INSTAGRAM -->

    <a href="YOUR-INSTAGRAM-LINK" target="_blank" aria-label="Instagram">

      <img
        src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/instagram.svg"
        alt="Instagram">

    </a>


    <!-- EMAIL -->

    <a
      href="mailto:sjndp.work@gmail.com?subject=Let%27s%20connect%21&body=Hello%20Jiah%2C%0D%0A%0D%0A"
      aria-label="Email">

      <img
        src="https://cdn.jsdelivr.net/npm/lucide-static@latest/icons/mail.svg"
        alt="Email">

    </a>


  </div>


</div>

</body>

</html>
