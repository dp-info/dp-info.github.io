<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dela Pena</title>

<style>

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  background: #ffffff;
  font-family: Arial, Helvetica, sans-serif;
}

body {
  display: flex;
  justify-content: center;
  background: #ffffff;
}

.page {
  width: 100%;
  max-width: 500px;
  min-height: 100vh;

  background: #ffffff;
  color: #000000;

  display: flex;
  flex-direction: column;
  align-items: center;

  text-align: center;
  overflow: hidden;
}


/* TOP SECTION */

.content {
  width: 100%;
  padding-top: 90px;
  position: relative;
  z-index: 2;
}


/* TAGLINE */

.tagline {
  font-size: 12px;
  font-weight: 300;
  letter-spacing: 5px;
  white-space: nowrap;
}


/* ICON GRID */

.links {
  display: grid;

  grid-template-columns: 50px 50px;

  column-gap: 85px;
  row-gap: 42px;

  justify-content: center;
  align-items: center;

  /* pushes icons lower */
  margin-top: 75px;

  /* smaller gap between icons and portrait */
  margin-bottom: 10px;
}


/* CLICKABLE ICON */

.links a {
  width: 50px;
  height: 50px;

  display: flex;
  align-items: center;
  justify-content: center;

  text-decoration: none;

  transition: transform 0.2s ease;
}

.links a:hover {
  transform: scale(1.10);
}


/* ICONS */

.links img {
  width: 42px;
  height: 42px;

  object-fit: contain;

  filter: brightness(0);
}


/* PORTRAIT */

.photo {
  width: 100%;

  display: flex;
  justify-content: center;
  align-items: flex-end;

  margin-top: auto;

  overflow: hidden;
}

.photo img {
  display: block;

  width: 100%;
  height: auto;

  object-fit: contain;
  object-position: center bottom;
}


/* MOBILE */

@media (max-width: 500px) {

  .content {
    padding-top: 85px;
  }

  .tagline {
    font-size: 11px;
    letter-spacing: 4px;
  }

  .links {
    margin-top: 70px;

    column-gap: 75px;
    row-gap: 38px;

    margin-bottom: 5px;
  }

  .links img {
    width: 40px;
    height: 40px;
  }

}

</style>
</head>


<body>

<div class="page">


  <div class="content">


    <!-- TAGLINE -->

    <div class="tagline">
      LEVERAGE YOUR DIFFERENTIAL
    </div>


    <!-- ICONS -->

    <div class="links">


      <!-- LINKEDIN -->

      <a
        href="YOUR-LINKEDIN-LINK"
        target="_blank"
        aria-label="LinkedIn">

        <img
          src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/linkedin.svg"
          alt="LinkedIn">

      </a>


      <!-- WHATSAPP -->

      <a
        href="YOUR-WHATSAPP-LINK"
        target="_blank"
        aria-label="WhatsApp">

        <img
          src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/whatsapp.svg"
          alt="WhatsApp">

      </a>


      <!-- INSTAGRAM -->

      <a
        href="YOUR-INSTAGRAM-LINK"
        target="_blank"
        aria-label="Instagram">

        <img
          src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/instagram.svg"
          alt="Instagram">

      </a>


      <!-- EMAIL -->

      <a
        href="mailto:sjndp.work@gmail.com,jiahdelapena@gmail.com?subject=Let%27s%20connect%21&body=Hello%20Jiah%2C%0D%0A%0D%0A"
        aria-label="Email">

        <img
          src="https://cdn.jsdelivr.net/npm/lucide-static@latest/icons/mail.svg"
          alt="Email">

      </a>


    </div>

  </div>


  <!-- PORTRAIT -->

  <div class="photo">

    <img
      src="photo1.jpg"
      alt="Dela Pena">

  </div>


</div>

</body>

</html>
