<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Jiah Dela Peña</title>

<style>

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  background: #000;
  font-family: Arial, Helvetica, sans-serif;
}

.page {
  width: 100%;
  max-width: 500px;
  min-height: 100vh;
  margin: auto;
  background: #000;
  text-align: center;
  color: white;
}

/* PHOTO */

.photo {
  position: relative;
  width: 100%;
  height: 480px;
  overflow: hidden;
}

.photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center top;
}

/* PHOTO → BLACK FADE */

.photo::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 45%;
  background: linear-gradient(
    to bottom,
    transparent 0%,
    #000 100%
  );
}

/* TAGLINE */

.tagline {
  margin-top: -25px;
  position: relative;
  z-index: 2;
  font-size: 13px;
  font-weight: 300;
  letter-spacing: 7px;
  white-space: nowrap;
}

/* LINKS */

.links {
  margin-top: 45px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 34px;
}

.links a {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 45px;
  height: 45px;
  text-decoration: none;
  transition: transform .2s ease;
}

.links a:hover {
  transform: scale(1.15);
}

.links img {
  width: 34px;
  height: 34px;
  object-fit: contain;
}

/* EMAIL ICON */

.email {
  font-size: 36px;
  color: white;
  font-weight: 200;
}

</style>
</head>


<body>

<div class="page">

  <div class="photo">
    <img src="photo.jpg" alt="Jiah Dela Peña">
  </div>

  <div class="tagline">
    LEVERAGE DIFFERENTIAL
  </div>


  <div class="links">

    <!-- LINKEDIN -->
    <a href="YOUR-LINKEDIN-LINK" target="_blank">
      <img
        src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/linkedin.svg"
        style="filter: invert(29%) sepia(99%) saturate(1695%) hue-rotate(181deg);"
        alt="LinkedIn">
    </a>


    <!-- WHATSAPP -->
    <a href="YOUR-WHATSAPP-LINK" target="_blank">
      <img
        src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/whatsapp.svg"
        style="filter: invert(65%) sepia(90%) saturate(500%) hue-rotate(85deg);"
        alt="WhatsApp">
    </a>


    <!-- INSTAGRAM -->
    <a href="YOUR-INSTAGRAM-LINK" target="_blank">
      <img
        src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/instagram.svg"
        style="filter: invert(35%) sepia(96%) saturate(3500%) hue-rotate(320deg);"
        alt="Instagram">
    </a>


    <!-- EMAIL -->
    <a
      class="email"
      href="mailto:sjndp.work@gmail.com?subject=Let%27s%20connect%21&body=Hello%20Jiah%2C%0D%0A%0D%0A">
      ✉
    </a>

  </div>

</div>

</body>
</html>
