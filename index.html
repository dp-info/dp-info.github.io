<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dela Pena</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  background: #ffffff;
  font-family: Arial, Helvetica, sans-serif;
}

body {
  display: flex;
  justify-content: center;
}


/* MAIN PAGE */

.page {
  width: 100%;
  max-width: 500px;

  min-height: 100vh;
  min-height: 100dvh;

  background: #ffffff;

  display: flex;
  flex-direction: column;
  align-items: center;

  overflow: hidden;
}


/* TOP SPACE + TEXT */

.content {
  width: 100%;

  padding-top: clamp(150px, 27dvh, 280px);

  display: flex;
  flex-direction: column;
  align-items: center;

  flex-shrink: 0;
}


/* MULTILINGUAL TEXT */

.languages {
  width: 90%;
  text-align: center;

  font-size: clamp(8px, 2.2vw, 10px);
  font-weight: 300;
  letter-spacing: 2px;
  line-height: 2;

  color: #dddddd;

  white-space: nowrap;
}

.languages .very-light {
  color: #e8e8e8;
}


/* MAIN TAGLINE */

.tagline {
  margin-top: 3px;

  font-size: clamp(8px, 2.25vw, 10px);
  font-weight: 300;

  letter-spacing: clamp(3px, 1vw, 5px);

  white-space: nowrap;

  color: #111111;
}

.tagline .orange {
  color: #ff580c;
}


/* ICON ROW */

.links {
  width: 100%;

  display: flex;
  justify-content: center;
  align-items: center;

  gap: clamp(40px, 12vw, 65px);

  margin-top: clamp(45px, 7dvh, 70px);
  margin-bottom: clamp(35px, 5dvh, 55px);
}


/* ICON CLICK AREA */

.links a {
  width: 42px;
  height: 42px;

  display: flex;
  justify-content: center;
  align-items: center;

  color: #111111;
  text-decoration: none;

  transition: opacity 0.2s ease, transform 0.2s ease;
}

.links a:hover {
  opacity: 0.55;
  transform: translateY(-2px);
}


/* THIN MINIMAL ICONS */

.links svg {
  width: 27px;
  height: 27px;

  fill: none;
  stroke: currentColor;

  stroke-width: 1.35;
  stroke-linecap: round;
  stroke-linejoin: round;
}


/* PHOTO */

.photo {
  width: 100%;

  margin-top: auto;

  display: flex;
  justify-content: center;
  align-items: flex-end;

  flex-shrink: 0;

  overflow: hidden;
}

.photo img {
  display: block;

  width: 100%;
  height: auto;

  margin: 0;
  padding: 0;

  object-fit: contain;
  object-position: center bottom;

  vertical-align: bottom;
}


/* SHORT SCREENS */

@media (max-height: 750px) {

  .content {
    padding-top: 90px;
  }

  .links {
    margin-top: 35px;
    margin-bottom: 20px;
  }

  .photo img {
    width: 90%;
  }

}


/* VERY SMALL PHONES */

@media (max-width: 350px) {

  .languages {
    font-size: 7px;
    letter-spacing: 1px;
  }

  .tagline {
    font-size: 7.5px;
    letter-spacing: 2.5px;
  }

  .links {
    gap: 28px;
  }

  .links svg {
    width: 24px;
    height: 24px;
  }

}


/* DESKTOP */

@media (min-width: 768px) {

  .content {
    padding-top: clamp(140px, 22vh, 230px);
  }

}

</style>

</head>
