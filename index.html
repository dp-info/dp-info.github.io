<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dela Pena</title>

<style>

/* =========================
   GENERAL
========================= */

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;

  width: 100%;
  min-height: 100%;

  background: #ffffff;

  font-family: Arial, Helvetica, sans-serif;
}

body {
  display: flex;
  justify-content: center;
}


/* =========================
   MAIN PAGE
========================= */

.page {
  width: 100%;
  max-width: 500px;

  /* FALLBACK */
  min-height: 100vh;

  /* ACTUAL MOBILE BROWSER HEIGHT */
  min-height: 100dvh;

  background: #ffffff;
  color: #000000;

  display: flex;
  flex-direction: column;

  align-items: center;

  text-align: center;

  overflow: hidden;
}


/* =========================
   TOP CONTENT
========================= */

.content {
  width: 100%;

  flex-shrink: 0;

  padding-top: clamp(45px, 7dvh, 80px);

  display: flex;
  flex-direction: column;
  align-items: center;
}


/* =========================
   TAGLINE
========================= */

.tagline {
  font-size: clamp(8px, 2.5vw, 11px);

  font-weight: 300;

  letter-spacing: clamp(2px, 0.9vw, 4px);

  white-space: nowrap;

  text-align: center;
}


/* =========================
   SOCIAL ICON GRID
========================= */

.links {
  display: grid;

  grid-template-columns: 44px 44px;

  column-gap: clamp(65px, 18vw, 85px);
  row-gap: clamp(28px, 4.5dvh, 38px);

  justify-content: center;
  align-items: center;

  margin-top: clamp(40px, 7dvh, 70px);

  margin-bottom: clamp(20px, 4dvh, 40px);
}


/* =========================
   CLICKABLE ICON AREA
========================= */

.links a {
  width: 44px;
  height: 44px;

  display: flex;
  align-items: center;
  justify-content: center;

  text-decoration: none;

  transition: transform 0.2s ease;
}

.links a:hover {
  transform: scale(1.10);
}


/* =========================
   ICONS
========================= */

.links img {
  width: clamp(28px, 7vw, 32px);
  height: clamp(28px, 7vw, 32px);

  object-fit: contain;

  filter: brightness(0);
}


/* =========================
   PHOTO
========================= */

.photo {
  width: 100%;

  /*
  THIS IS THE IMPORTANT PART:
  automatically fills remaining space
  above the portrait and pushes the
  portrait to the bottom of the browser.
  */

  margin-top: auto;

  flex-shrink: 0;

  display: flex;

  justify-content: center;
  align-items: flex-end;

  overflow: hidden;
}


/* PHOTO ITSELF */

.photo img {
  display: block;

  width: 100%;
  height: auto;

  margin: 0;
  padding: 0;

  object-fit: contain;

  object-position: center bottom;

  vertical-align: bottom;
}


/* =========================
   VERY SMALL / SHORT PHONES
   iPhone SE / Mini etc.
========================= */

@media (max-height: 700px) {

  .content {
    padding-top: 30px;
  }

  .links {
    margin-top: 30px;

    row-gap: 20px;

    margin-bottom: 15px;
  }

  .links img {
    width: 28px;
    height: 28px;
  }

}


/* =========================
   VERY NARROW PHONES
========================= */

@media (max-width: 350px) {

  .tagline {
    font-size: 8px;
    letter-spacing: 2px;
  }

  .links {
    column-gap: 60px;
  }

}


/* =========================
   LARGE PHONES
========================= */

@media (min-width: 430px) and (max-width: 767px) {

  .content {
    padding-top: 70px;
  }

}


/* =========================
   DESKTOP / TABLET
========================= */

@media (min-width: 768px) {

  .page {
    max-width: 500px;
  }

  .content {
    padding-top: 80px;
  }

  .links {
    margin-top: 70px;
  }

}

</style>

</head>


<body>


<div class="page">


  <!-- TOP CONTENT -->

  <div class="content">


    <!-- TAGLINE -->

    <div class="tagline">
      LEVERAGE YOUR DIFFERENTIAL
    </div>



    <!-- SOCIAL MEDIA ICONS -->

    <div class="links">


      <!-- LINKEDIN -->

      <a
        href="https://www.linkedin.com/in/jiahdelapena/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="LinkedIn">

        <img
          src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/linkedin.svg"
          alt="LinkedIn">

      </a>



      <!-- WHATSAPP -->

      <a
        href="https://wa.me/message/6ZUUCCETCAHSI1"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="WhatsApp">

        <img
          src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/whatsapp.svg"
          alt="WhatsApp">

      </a>



      <!-- INSTAGRAM -->

      <a
        href="https://www.instagram.com/jiahdelapena"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Instagram">

        <img
          src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/instagram.svg"
          alt="Instagram">

      </a>



      <!-- EMAIL -->

      <a
        href="mailto:sjndp.work@gmail.com,jiahdelapena@gmail.com?subject=Let%27s%20connect%21&body=Hello%20Dela%20Pena%2C%0D%0A%0D%0A"
        aria-label="Email">

        <img
          src="https://cdn.jsdelivr.net/npm/lucide-static@latest/icons/mail.svg"
          alt="Email">

      </a>


    </div>

  </div>



  <!-- PORTRAIT -->

  <div class="photo">

    <img
      src="photo1.jpg"
      alt="Dela Pena">

  </div>


</div>


</body>

</html>
